style_guide.page:
  path: '/style-guide'
  defaults:
    _controller: '\Drupal\style_guide\Controller\StyleGuideController::content'
    _title: 'Style Guide'
  requirements:
    _permission: 'access content'

style_guide.centered:
  path: '/style-guide/centered'
  defaults:
    _controller: '\Drupal\style_guide\Controller\StyleGuideController::centeredContent'
    _title: 'Style Guide (Centered)'
  requirements:
    _permission: 'access content'
